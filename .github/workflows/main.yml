name: Build PhpStorm Stubs Chinese

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, json, libxml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer config
        run: composer validate --strict

      - name: Run unit tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Run coding standard check
        run: vendor/bin/phpcs src tests --standard=PSR12

  build:
    name: Build Chinese stubs
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, json, libxml, xmlreader, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Create resource directories
        run: mkdir -p resources php-doc

      - name: Clone PHP documentation build tools
        run: |
          git clone --depth 1 https://github.com/php/phd php-doc/phd
          git clone --depth 1 https://github.com/php/doc-base php-doc/doc-base

      - name: Clone PHP documentation sources
        run: |
          git clone --depth 1 https://github.com/php/doc-en php-doc/en
          git clone --depth 1 https://github.com/php/doc-zh php-doc/zh

      - name: Build Chinese php-chunked-xhtml
        working-directory: php-doc
        run: |
          php doc-base/configure.php --with-lang=zh
          php phd/render.php --docbook doc-base/.manual.xml --package PHP --format xhtml
          cp -r output/php-chunked-xhtml ../resources/

      - name: Clone phpstorm-stubs
        run: git clone --depth 1 https://github.com/JetBrains/phpstorm-stubs resources/phpstorm-stubs

      - name: Build translated stubs
        run: composer build

      - name: Upload generated library
        uses: actions/upload-artifact@v4
        with:
          name: phpstorm-stubs-chinese
          path: resources/library
          if-no-files-found: error
